[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
# GPL-3.0-or-later rather than the bare `GPL-3.0`, which SPDX deprecated. gpui is
# Apache-2.0, which is compatible with GPL **v3** and not with v2 — so this choice is
# what keeps the dependency tree licensable at all. Everything else is MIT or
# MIT-OR-Apache-2.0.
license = "GPL-3.0-or-later"
repository = "https://github.com/aryanjha256/zuno"
description = "A ridiculously fast API client"
authors = ["Aryan Kumar <aryanajha256@gmail.com>"]

# Applies to `cargo build --release` and so to every packaged build.
#
# `strip` is the one that matters for a download: an unstripped Rust binary carries
# megabytes of symbols nobody installing a .deb will use. `panic` is deliberately left at
# `unwind` — `abort` would skip unwinding, and Zuno saves the session on the way out.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[workspace.dependencies]
gpui = "0.2.2"
zuno-core = { path = "core" }

bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
http = "1"

# HTTP. Used directly rather than through gpui's re-exported `http_client`, which is
# shaped for Zed's own fetching (GitHub release downloads, proxy plumbing). An API
# testing client needs the opposite of an abstraction: per-request TLS and redirect
# control, streaming bodies, and raw header access. See architecture.md §9.
reqwest = { version = "0.13", default-features = false, features = [
    # 0.13 renamed the TLS features: `rustls-tls` became `rustls`.
    "rustls",
    "stream",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "cookies",
    "http2",
    # Multipart bodies. Enabled when multipart authoring landed; `build.rs` returns
    # `UnsupportedBody` without it.
    "multipart",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    # `AsyncReadExt`/`AsyncWriteExt` over the upgraded WebSocket stream.
    "io-util",
    # `select!`, which is how a session waits on the socket and the user at the same time.
    "macros",
] }

# **The WebSocket half of the engine.** Three crates, and the feature list is the whole
# design decision.
#
# `hyper` and `hyper-util` are direct dependencies rather than transitive accidents because
# reqwest 0.13 exports an `Upgraded` type and no way to reach one: there is no
# `Response::upgrade()`. The route is `From<Response> for http::Response<Body>` — which
# preserves `extensions` — then `hyper::upgrade::on`, then `hyper_util::rt::TokioIo` to get
# tokio's traits back. `tests/websocket_upgrade.rs` pins that this works, because it is
# three layers of somebody else's internals agreeing with each other.
#
# Doing it this way is what lets a WebSocket inherit the user's TLS settings, client
# certificates, proxy and cookie jar. `tokio-tungstenite`'s own `connect_async` would open
# its own socket and silently ignore every one of them.
#
# Hence `default-features = false`: `connect` is exactly the part we must not use. Only
# `handshake` is kept, for `generate_key` and `derive_accept_key` — writing those by hand
# would mean a sha1 and base64 dependency to reimplement four lines the crate already has.
hyper = { version = "1", features = ["client", "http1"] }
# gRPC schema. **No `protoc` binary**: `protox` is a protobuf compiler written in Rust, so a
# `.proto` compiles inside Zuno with nothing installed — which is what makes this shippable in a
# `.deb` at all. `prost-reflect` is the other half: a descriptor pool plus `DynamicMessage`, so a
# message can be encoded against a schema learned at runtime rather than generated at build time.
# `serde` on it is what lets a person type JSON and have it become protobuf.
#
# Deliberately **not `tonic`**: it would bring its own client, codegen and connection handling,
# and the transport is already proven on reqwest — see `core/tests/grpc_trailers.rs`. gRPC's wire
# framing is a compression byte and a length prefix, which is not worth a dependency.
protox = "0.9"
prost-reflect = { version = "0.16", features = ["serde"] }
prost = "0.14"

hyper-util = { version = "0.1", features = ["tokio"] }
# Reading HTTP/2 **trailers**, which is where gRPC puts its status and which reqwest names
# nowhere. `reqwest::Body` implements `http_body::Body`, whose frames are either data or
# trailers; `BodyExt::collect` is what walks them. Proven end to end before anything was built
# on it — see `core/tests/grpc_trailers.rs`.
http-body-util = "0.1"
# **A cookie jar Zuno owns, so it can be shown.** reqwest's `cookie_store(true)` keeps its jar
# private — "Clear stored cookies" had to drop every cached client to empty it — and gives each
# client its own, so requests with different settings did not share cookies at all. One
# `CookieStoreMutex`, handed to every client through `cookie_provider`, is both readable and
# shared. `cookie_store` 0.22 is already in the tree through reqwest's `cookies` feature; this
# adds only the adapter between the two.
reqwest_cookie_store = "0.10"
# Named directly only to read a stored cookie's domain and expiry, whose types it defines. The
# same 0.22 reqwest already builds, default features and all, so nothing new is compiled.
cookie_store = "0.22"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
# Runtime-agnostic channel: written from tokio tasks, awaited on gpui's smol executor.
async-channel = "2"
futures-util = "0.3"
# Inline body diff. Zero transitive dependencies — verified with `cargo tree` — which is
# why it wins over `imara-diff` (4 crates) despite being slower: at response-body sizes the
# difference is unmeasurable and the dependency tree is not. `inline` is **not** a default
# feature and is what `iter_inline_changes` lives behind; it pulls nothing extra.
similar = { version = "3.2.0", features = ["inline"] }
# Pulling readable text out of an HTML response (architecture.md §6n).
#
# **Chosen over `nanohtml2text` on correctness, having started with it.** That crate is one
# crate to this one's thirty and twelve times faster, and it passes `<pre>` contents through
# **raw** — entities undecoded, nested tags left as literal markup. `<pre>` is where Django,
# Flask and Rails all put the traceback, which is the entire reason this feature exists, so the
# cheap option was broken in exactly the case it was bought for. Measured, not read: the test
# `a_framework_error_page_reduces_to_its_message` fails against it.
#
# `default = []`, so `css`, `xml` and the tracing features stay off — they add `nom`,
# `xml5ever`, `log` and `backtrace` respectively, none of which extraction needs.
html2text = { version = "0.17.1", default-features = false }
# Moving a request to the desktop trash rather than deleting it. Hand-rolling the XDG spec
# (~/.local/share/Trash/files plus a .trashinfo naming the original path, with a
# cross-filesystem fallback and collision handling) is the kind of "80 lines" that is wrong in
# the cases nobody tests. Default features off: they pull `chrono`, and every one of the
# `coinit_*` flags is Windows COM configuration.
trash = { version = "5", default-features = false }
# Grapheme-aware cursor movement. Already in the tree via gpui, so this pins the
# same version rather than adding a second copy.
unicode-segmentation = "1.13"

# The two tower traits, and only those two, for the connector layer that times a
# connection (`core/src/engine/probe.rs`). `tower` itself would work and is also already in
# the tree, but these are what it re-exports and they carry no features to choose. Both are
# already in `Cargo.lock` at 0.3.3 via reqwest, so declaring them adds **no** crate to the
# graph — verified with `cargo info`, per invariant 5, rather than written from memory.
tower-layer = "0.3.3"
tower-service = "0.3.3"
