name: Release

# Push a tag, get a .deb attached to a GitHub Release. `scripts/release.sh` does the local
# half — bump, lock, test, commit, tag — and pushes only with `--push`:
#
#   scripts/release.sh minor          # 0.1.5 -> 0.2.0, stops before pushing
#   scripts/release.sh 0.2.0 --push
#
# The tag is checked against Cargo.toml below, so a hand-made tag that disagrees fails here
# rather than producing a .deb whose filename lies about its contents.
#
# `workflow_dispatch` builds the same package without tagging or publishing anything, so
# the pipeline can be exercised before committing to a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload the asset

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  deb:
    # NOT ubuntu-latest, and this is the whole reason one .deb can cover many distros.
    #
    # glibc is backward- but not forward-compatible, so a binary built here runs on any
    # newer glibc but never an older one. Building on 22.04 makes dpkg-shlibdeps emit
    # `libc6 (>= 2.35)`, which installs on Ubuntu 22.04+ and Debian 12+. Building on
    # 24.04 would emit `libc6 (>= 2.39)` and silently drop both of those.
    #
    # If GitHub retires this runner image, don't "fix" it by moving to ubuntu-latest —
    # that quietly narrows who can install the result. Use a container instead:
    #   runs-on: ubuntu-latest
    #   container: ubuntu:22.04
    # and install rustup plus the apt list below inside it.
    runs-on: ubuntu-22.04
    # Same reasoning as the branch workflow: a hang here burned six hours of budget before
    # GitHub cancelled it, on a job whose honest worst case is a cold release build.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            desktop-file-utils

      # The runner image ships a Rust toolchain, but it can lag behind what the workspace
      # needs — edition 2024 wants 1.85+, resolver "3" wants 1.84+, cargo-deb wants 1.85.
      - name: Use current stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version && cargo --version

      # A tag that disagrees with Cargo.toml produces a .deb whose filename lies about
      # its contents. Cheaper to fail here than to unpublish a release.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zuno") | .version')
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      # A release build is the wrong place to discover a broken test. The branch workflow
      # doesn't run on tag pushes, so this is not redundant.
      - name: Test
        timeout-minutes: 10
        run: cargo test --workspace

      - name: Validate the desktop entry
        run: desktop-file-validate assets/dev.zuno.Zuno.desktop

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      - name: Build the .deb
        run: cargo deb -p zuno

      # Printed into the log so a failed install can be diagnosed from the run alone,
      # without anyone re-downloading and unpacking the artifact.
      - name: Inspect the package
        run: |
          deb=$(ls target/debian/*.deb)
          echo "path=$deb"
          ls -lh "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          echo "DEB_PATH=$deb" >> "$GITHUB_ENV"

      # **The same binary as the .deb, laid out as a prefix** — for every Linux without apt, and
      # for anyone who unpacks by hand. `bin/` and `share/` mirror `/usr`, so the one archive
      # installs to `~/.local` without sudo (what `install.sh` does off Debian) or to
      # `/usr/local` with it: `tar -xzf … --strip-components=1 -C ~/.local`.
      #
      # Reused rather than rebuilt: `cargo deb` has just produced `target/release/zuno`, already
      # stripped by the release profile, so the tarball inherits this runner's glibc 2.35 floor
      # and the binary the tests above ran against. `VERSION` is how the installer knows what an
      # unpacked copy is, since there is no package database to ask.
      - name: Build the tarball
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zuno") | .version')
          name="zuno-${version}-x86_64-linux"
          stage="target/tarball/$name"
          rm -rf target/tarball
          install -Dm755 target/release/zuno "$stage/bin/zuno"
          install -Dm644 assets/dev.zuno.Zuno.desktop "$stage/share/applications/dev.zuno.Zuno.desktop"
          install -Dm644 assets/icons/zuno.svg "$stage/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg"
          install -Dm644 README.md "$stage/share/doc/zuno/README.md"
          install -Dm644 LICENSE "$stage/share/doc/zuno/LICENSE"
          printf '%s\n' "$version" > "$stage/share/doc/zuno/VERSION"
          chmod 644 "$stage/share/doc/zuno/VERSION"
          # Root-owned in the archive, so unpacking as root does not create files owned by the
          # runner's uid 1001 — and unpacking as a user gives that user ownership either way.
          tar --owner=0 --group=0 --numeric-owner -C target/tarball \
            -czf "target/debian/$name.tar.gz" "$name"
          tar -tzvf "target/debian/$name.tar.gz"
          echo "TARBALL_PATH=$PWD/target/debian/$name.tar.gz" >> "$GITHUB_ENV"

      # `scripts/install.sh` reads this file for two things, not one: the hash, and the
      # asset's *real* filename. cargo-deb appends a Debian revision the git tag does not
      # carry (`zuno_0.2.5-1_amd64.deb` for tag v0.2.5), so an installer that builds the
      # name from the tag 404s on every download. Publishing the list means the name is
      # read rather than guessed.
      - name: Write the checksums
        run: |
          cd "$(dirname "$DEB_PATH")"
          # A bare glob, not `./*.deb`: the latter records the name as `./zuno_…deb`, which is
          # a worse artifact to read and was the spelling that broke the installer's lookup on
          # the first release to carry this file. The installer tolerates both now; this keeps
          # the published list plain.
          sha256sum -- *.deb *.tar.gz > sha256sums.txt
          cat sha256sums.txt
          echo "SUMS_PATH=$PWD/sha256sums.txt" >> "$GITHUB_ENV"

      # The two dlopen'ed libraries cannot be detected by dpkg-shlibdeps, so they are
      # declared by hand in app/Cargo.toml. If someone removes them the package still
      # builds and installs, then dies at startup on a clean machine — so assert here
      # rather than finding out from a bug report.
      - name: Assert the runtime dependencies survived
        run: |
          depends=$(dpkg-deb --field "$DEB_PATH" Depends)
          echo "$depends"
          for lib in libvulkan1 libwayland-client0; do
            case "$depends" in
              *"$lib"*) echo "ok: $lib" ;;
              *) echo "::error::$lib missing from Depends"; exit 1 ;;
            esac
          done
          # Guards the runner choice above: a build on a newer image bumps this floor and
          # locks out Ubuntu 22.04 and Debian 12 without any other visible symptom.
          case "$depends" in
            *"libc6 (>= 2.35)"*) echo "ok: glibc floor is 2.35" ;;
            *) echo "::error::unexpected glibc floor — was this built on ubuntu-22.04?"; exit 1 ;;
          esac

      # Always uploaded, so a workflow_dispatch run is downloadable without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: zuno-linux
          path: |
            target/debian/*.deb
            target/debian/*.tar.gz
          if-no-files-found: error

      # Written to a file rather than piped: `--notes-file` and `--generate-notes` are
      # mutually exclusive in gh, and a heredoc nested inside a YAML block scalar depends
      # on the indentation surviving two levels of stripping.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo '### Install or update'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/aryanjha256/zuno/main/scripts/install.sh | sh'
            echo '```'
            echo
            echo 'The same command does both — it installs Zuno if you do not have it and'
            echo 'updates it if you do. On Debian and Ubuntu it installs the .deb and asks'
            echo 'for sudo only to run `apt-get install`; everywhere else — Fedora, openSUSE,'
            echo 'Arch — it unpacks the tarball into `~/.local`, with no sudo at all.'
            echo
            echo '<details><summary>Or install the .deb by hand</summary>'
            echo
            echo '```bash'
            echo 'sudo apt install ./zuno_*_amd64.deb'
            echo '```'
            echo
            echo 'Use `apt install ./file.deb` rather than `dpkg -i`, so the runtime'
            echo 'dependencies are resolved for you.'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Or unpack the tarball by hand</summary>'
            echo
            echo '```bash'
            echo 'tar -xzf zuno-*-x86_64-linux.tar.gz --strip-components=1 -C ~/.local'
            echo '```'
            echo
            echo 'It needs `libxkbcommon`, `libxkbcommon-x11` and `libxcb`, which every'
            echo 'desktop already has, plus a Vulkan driver.'
            echo
            echo '</details>'
            echo
            echo 'Requires x86-64 Linux with glibc 2.35+: Ubuntu 22.04+, Debian 12+,'
            echo 'Fedora 36+, or anything as recent.'
            echo
            echo 'Zuno renders through Vulkan. On a machine with no GPU driver present,'
            echo 'install `mesa-vulkan-drivers` as well.'
          } > release-notes.md
          cat release-notes.md

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DEB_PATH" "$TARBALL_PATH" "$SUMS_PATH" \
            --title "Zuno $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  # The installer is the only shipped artifact with no compiler behind it, and its failure
  # mode is that it breaks *only for people who do not have Zuno yet* — precisely the
  # population that cannot report it. So the published release is installed for real, in a
  # clean container, before anyone else tries it.
  #
  # `needs: deb` and a tag guard, because it installs the release that job just published.
  smoke:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Its own `timeout-minutes`: a job-level one cannot say which phase stalled, and the
      # twin of this step in `installer.yml` died reporting only "The operation was canceled".
      - name: Install the published release in a clean Ubuntu 22.04
        timeout-minutes: 10
        env:
          # 22.04 is the floor the .deb claims (`libc6 (>= 2.35)`), so this also proves the
          # claim rather than trusting it.
          IMAGE: ubuntu:22.04
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm \
            -e "ZUNO_VERSION=$version" \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/scripts/install.sh:/install.sh:ro" \
            "$IMAGE" sh -c '
              set -eux

              # A container does not inherit the apt mirror of the runner that started it: a
              # stock ubuntu:22.04 ships archive.ubuntu.com, which is geo-routed and throttled
              # from Azure, while the hosted image uses azure.archive.ubuntu.com in the same
              # datacentre. This step passed in five minutes on the run that gave the twin job
              # a fifteen-minute timeout, which is the spread this removes.
              sed -i -e "s|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g" -e "s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g" /etc/apt/sources.list

              # Not silenced. As `-qq >/dev/null` these printed nothing at all while they
              # stalled, so the log ended at the image pull and said nothing about the phase.
              apt-get update
              apt-get install -y curl ca-certificates

              sh /install.sh

              # Installed, and installed where the .desktop and the launcher expect. The
              # filename must equal the app_id or Wayland shows a generic icon with no
              # error anywhere, so it is asserted rather than assumed.
              # No `-f` format: `${Package}` inside double quotes is expanded by *this* shell,
              # and under `set -eu` an unset parameter aborts the job.
              dpkg-query -W zuno
              test -x /usr/bin/zuno
              test -f /usr/share/applications/dev.zuno.Zuno.desktop
              test -f /usr/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg

              # The update path: re-running is what an existing user does, and it has to be
              # a clean no-op rather than a reinstall or an error.
              out=$(sh /install.sh 2>&1)
              printf "%s\n" "$out"
              case "$out" in
                *"already the latest"*) echo "ok: re-run is a no-op" ;;
                *) echo "::error::re-running the installer did not report an up-to-date install"; exit 1 ;;
              esac
            '

  # **The published tarball, on Fedora, as an ordinary user** — the `smoke` job's check for the
  # path every non-apt Linux takes. `installer.yml`'s `tarball` job proves the script's logic
  # against a stand-in binary; this is the one that proves the *real* archive installs and that
  # its binary finds every library it links.
  smoke-tarball:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the published tarball in a clean Fedora
        timeout-minutes: 10
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm \
            -e "ZUNO_VERSION=$version" \
            -v "$PWD/scripts/install.sh:/install.sh:ro" \
            fedora:latest sh -c '
              set -eux
              dnf install -y tar
              command -v curl || dnf install -y curl
              # **The three desktop libraries the binary links**, which every Fedora desktop
              # already has and a minimal container does not — read off the release binary with
              # `readelf -d`: libxcb, libxkbcommon and libxkbcommon-x11, beside glibc and
              # libgcc. The tarball declares no dependencies, so this list is what the `ldd`
              # check below holds it to. A new NEEDED entry fails the job rather than a
              # user, which is the point: README says what a tarball install needs.
              dnf install -y libxcb libxkbcommon libxkbcommon-x11
              useradd -m tester

              su tester -c "ZUNO_VERSION=$ZUNO_VERSION sh /install.sh"

              bin=/home/tester/.local/bin/zuno
              test -x "$bin"
              test -f /home/tester/.local/share/applications/dev.zuno.Zuno.desktop
              test -f /home/tester/.local/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg
              grep -qx "Exec=\"$bin\"" /home/tester/.local/share/applications/dev.zuno.Zuno.desktop

              ldd "$bin"
              if ldd "$bin" | grep -q "not found"; then
                echo "::error::the tarball binary links a library a Fedora desktop may lack"
                exit 1
              fi

              out=$(su tester -c "ZUNO_VERSION=$ZUNO_VERSION sh /install.sh" 2>&1)
              printf "%s\n" "$out"
              case "$out" in
                *"already the latest"*) echo "ok: re-run is a no-op" ;;
                *) echo "::error::re-running the installer did not report an up-to-date install"; exit 1 ;;
              esac
            '

