name: Release

# Push a tag, get a GitHub Release carrying the .deb, the Linux tarball, the AppImage, Zuno.app
# for macOS and a zip for Windows — built by `deb`, `macos` and `windows`, published together by
# `publish`, then
# installed for real by the `smoke*` jobs. `scripts/release.sh` does the local
# half — bump, lock, test, commit, tag — and pushes only with `--push`:
#
#   scripts/release.sh minor          # 0.1.5 -> 0.2.0, stops before pushing
#   scripts/release.sh 0.2.0 --push
#
# The tag is checked against Cargo.toml below, so a hand-made tag that disagrees fails here
# rather than producing a .deb whose filename lies about its contents.
#
# `workflow_dispatch` builds the same package without tagging or publishing anything, so
# the pipeline can be exercised before committing to a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload the asset

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  deb:
    # NOT ubuntu-latest, and this is the whole reason one .deb can cover many distros.
    #
    # glibc is backward- but not forward-compatible, so a binary built here runs on any
    # newer glibc but never an older one. Building on 22.04 makes dpkg-shlibdeps emit
    # `libc6 (>= 2.35)`, which installs on Ubuntu 22.04+ and Debian 12+. Building on
    # 24.04 would emit `libc6 (>= 2.39)` and silently drop both of those.
    #
    # If GitHub retires this runner image, don't "fix" it by moving to ubuntu-latest —
    # that quietly narrows who can install the result. Use a container instead:
    #   runs-on: ubuntu-latest
    #   container: ubuntu:22.04
    # and install rustup plus the apt list below inside it.
    runs-on: ubuntu-22.04
    # Same reasoning as the branch workflow: a hang here burned six hours of budget before
    # GitHub cancelled it, on a job whose honest worst case is a cold release build.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            desktop-file-utils

      # The runner image ships a Rust toolchain, but it can lag behind what the workspace
      # needs — edition 2024 wants 1.85+, resolver "3" wants 1.84+, cargo-deb wants 1.85.
      - name: Use current stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version && cargo --version

      # A tag that disagrees with Cargo.toml produces a .deb whose filename lies about
      # its contents. Cheaper to fail here than to unpublish a release.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zuno") | .version')
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      # A release build is the wrong place to discover a broken test. The branch workflow
      # doesn't run on tag pushes, so this is not redundant.
      - name: Test
        timeout-minutes: 10
        run: cargo test --workspace

      - name: Validate the desktop entry
        run: desktop-file-validate assets/dev.zuno.Zuno.desktop

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      - name: Build the .deb
        run: cargo deb -p zuno

      # Printed into the log so a failed install can be diagnosed from the run alone,
      # without anyone re-downloading and unpacking the artifact.
      - name: Inspect the package
        run: |
          deb=$(ls target/debian/*.deb)
          echo "path=$deb"
          ls -lh "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          echo "DEB_PATH=$deb" >> "$GITHUB_ENV"

      # **The same binary as the .deb, laid out as a prefix** — for every Linux without apt, and
      # for anyone who unpacks by hand. `bin/` and `share/` mirror `/usr`, so the one archive
      # installs to `~/.local` without sudo (what `install.sh` does off Debian) or to
      # `/usr/local` with it: `tar -xzf … --strip-components=1 -C ~/.local`.
      #
      # Reused rather than rebuilt: `cargo deb` has just produced `target/release/zuno`, already
      # stripped by the release profile, so the tarball inherits this runner's glibc 2.35 floor
      # and the binary the tests above ran against. `VERSION` is how the installer knows what an
      # unpacked copy is, since there is no package database to ask.
      - name: Build the tarball
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zuno") | .version')
          name="zuno-${version}-x86_64-linux"
          stage="target/tarball/$name"
          rm -rf target/tarball
          install -Dm755 target/release/zuno "$stage/bin/zuno"
          install -Dm644 assets/dev.zuno.Zuno.desktop "$stage/share/applications/dev.zuno.Zuno.desktop"
          install -Dm644 assets/icons/zuno.svg "$stage/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg"
          install -Dm644 README.md "$stage/share/doc/zuno/README.md"
          install -Dm644 LICENSE "$stage/share/doc/zuno/LICENSE"
          printf '%s\n' "$version" > "$stage/share/doc/zuno/VERSION"
          chmod 644 "$stage/share/doc/zuno/VERSION"
          # Root-owned in the archive, so unpacking as root does not create files owned by the
          # runner's uid 1001 — and unpacking as a user gives that user ownership either way.
          tar --owner=0 --group=0 --numeric-owner -C target/tarball \
            -czf "target/debian/$name.tar.gz" "$name"
          tar -tzvf "target/debian/$name.tar.gz"
          echo "TARBALL_PATH=$PWD/target/debian/$name.tar.gz" >> "$GITHUB_ENV"

      # **One file that runs on most distros without installing** — the same binary again, in an
      # AppDir. No libraries are bundled, exactly as in the tarball: it uses the system's
      # libxkbcommon, libxcb and Vulkan, because a bundled Vulkan loader is how GPU apps in
      # AppImages break the driver the system already has.
      #
      # **Both tools pinned by version and hash.** appimagetool 1.9 otherwise *downloads the
      # AppImage runtime from GitHub while it builds*, which is an unpinned fetch inside every
      # release; `--runtime-file` hands it one we checked. The runtime is type2's static build —
      # no NEEDED entries, libfuse compiled in — so the result needs only `fusermount` on the
      # user's machine, not libfuse2. `--appimage-extract-and-run` because the runner has no FUSE.
      # Both hashes were verified against the digests GitHub publishes for these assets.
      - name: Build the AppImage
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zuno") | .version')

          tools=target/appimage-tools
          mkdir -p "$tools"
          curl -fsSL --proto '=https' -o "$tools/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL --proto '=https' -o "$tools/runtime-x86_64" "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  $tools/appimagetool" | sha256sum -c -
          echo "$RUNTIME_SHA256  $tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/appimagetool"

          # The .desktop and icon at the AppDir root are what appimagetool and the runtime read;
          # the `usr/share` copies are what a desktop integration tool installs from.
          appdir=target/appimage/Zuno.AppDir
          rm -rf target/appimage
          install -Dm755 target/release/zuno "$appdir/usr/bin/zuno"
          install -Dm644 assets/dev.zuno.Zuno.desktop "$appdir/usr/share/applications/dev.zuno.Zuno.desktop"
          install -Dm644 assets/icons/zuno.svg "$appdir/usr/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg"
          cp assets/dev.zuno.Zuno.desktop "$appdir/dev.zuno.Zuno.desktop"
          cp assets/icons/zuno.svg "$appdir/dev.zuno.Zuno.svg"
          ln -s dev.zuno.Zuno.svg "$appdir/.DirIcon"
          ln -s usr/bin/zuno "$appdir/AppRun"

          out="$PWD/target/debian/Zuno-${version}-x86_64.AppImage"
          ARCH=x86_64 "$tools/appimagetool" --appimage-extract-and-run \
            --runtime-file "$tools/runtime-x86_64" "$appdir" "$out"
          ls -lh "$out"
          echo "APPIMAGE_PATH=$out" >> "$GITHUB_ENV"

      # The two dlopen'ed libraries cannot be detected by dpkg-shlibdeps, so they are
      # declared by hand in app/Cargo.toml. If someone removes them the package still
      # builds and installs, then dies at startup on a clean machine — so assert here
      # rather than finding out from a bug report.
      - name: Assert the runtime dependencies survived
        run: |
          depends=$(dpkg-deb --field "$DEB_PATH" Depends)
          echo "$depends"
          for lib in libvulkan1 libwayland-client0; do
            case "$depends" in
              *"$lib"*) echo "ok: $lib" ;;
              *) echo "::error::$lib missing from Depends"; exit 1 ;;
            esac
          done
          # Guards the runner choice above: a build on a newer image bumps this floor and
          # locks out Ubuntu 22.04 and Debian 12 without any other visible symptom.
          case "$depends" in
            *"libc6 (>= 2.35)"*) echo "ok: glibc floor is 2.35" ;;
            *) echo "::error::unexpected glibc floor — was this built on ubuntu-22.04?"; exit 1 ;;
          esac

      # Always uploaded, so a workflow_dispatch run is downloadable without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: zuno-linux
          path: |
            target/debian/*.deb
            target/debian/*.tar.gz
            target/debian/*.AppImage
          if-no-files-found: error

  # **Zuno.app for Apple Silicon**, packed by `scripts/macos-bundle.sh` — the same script a
  # developer runs on their own Mac — and ad-hoc signed. No Developer ID and no notarization, so
  # the app is installed by `install.sh` over curl, which sets no quarantine flag for Gatekeeper
  # to act on; a browser-downloaded copy is blocked, which is why the release notes do not offer
  # one. macos-14 is an arm64 runner, so the binary is native rather than cross-compiled.
  macos:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Use current stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version && cargo --version

      # For the icon: `rsvg-convert` draws zuno.svg at each size `iconutil` packs into an .icns.
      - name: Install librsvg
        run: brew install librsvg

      # The Linux job tests on Linux; this is the build that ships to Macs, so it tests here.
      - name: Test
        timeout-minutes: 15
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p zuno

      - name: Bundle, sign and pack Zuno.app
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zuno") | .version')
          archive=$(sh scripts/macos-bundle.sh target/release/zuno "$version" target/macos | tail -n 1)
          ls -lh "$archive"
          echo "APP=$PWD/target/macos/Zuno.app" >> "$GITHUB_ENV"

      # **The bundle's contract, asserted**, as the Linux job asserts the .deb's Depends: an icon
      # (a missing `rsvg-convert` degrades to none, silently), an arm64 binary, and nothing linked
      # from outside the OS — a Homebrew dylib would work on this runner and on no one's Mac.
      - name: Check the bundle
        run: |
          test -f "$APP/Contents/Resources/zuno.icns" || { echo "::error::no icon in the bundle"; exit 1; }
          lipo -archs "$APP/Contents/MacOS/zuno" | grep -qx arm64 \
            || { echo "::error::the binary is not arm64-only"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP"
          otool -L "$APP/Contents/MacOS/zuno"
          outside=$(otool -L "$APP/Contents/MacOS/zuno" | tail -n +2 | awk '{print $1}' \
            | grep -vE '^(/System/Library/|/usr/lib/)' || true)
          if [ -n "$outside" ]; then
            echo "::error::the binary links libraries outside the OS: $outside"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zuno-macos
          path: target/macos/*.tar.gz
          if-no-files-found: error

  # **zuno.exe for x86-64 Windows, in a zip** that `scripts/install.ps1` installs. Not code-signed,
  # for the macOS job's reason and with the same answer: PowerShell's own download sets no Mark of
  # the Web, so SmartScreen has nothing to act on.
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # **The C runtime linked in**, or zuno.exe needs VCRUNTIME140.dll — present on most machines
      # because so much else installs it, absent on a clean Windows, where Zuno would not start.
      # Here rather than in `.cargo/config.toml`, which this `RUSTFLAGS` would silently override.
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Use current stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version; cargo --version

      - name: Test
        timeout-minutes: 20
        run: cargo test --workspace

      # Also embeds the icon: `app/build.rs` fails the build rather than ship an exe without it.
      - name: Build
        run: cargo build --release -p zuno

      # **The exe's contract, asserted**, as the other jobs assert theirs. Both failures here are
      # invisible from a build log and obvious to a user: a console window beside the app, or an
      # app that does not start on a machine without the Visual C++ runtime.
      - name: Check the exe
        run: |
          $exe = 'target\release\zuno.exe'
          # The PE header's Subsystem field: 2 is a GUI program, 3 a console one.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) { throw "zuno.exe is not a GUI program (subsystem $subsystem)" }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $dependents = & $dumpbin /dependents $exe | Out-String
          Write-Host $dependents
          if ($dependents -match '(?i)vcruntime|msvcp|ucrtbase|api-ms-win-crt') {
            throw 'zuno.exe links the C runtime dynamically; it would not start without the redistributable'
          }

      - name: Pack the zip
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'zuno' | Select-Object -ExpandProperty version
          $name = "zuno-$version-x86_64-windows"
          $stage = "target\windows\$name"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target\release\zuno.exe, README.md, LICENSE $stage
          # What install.ps1 reads to know what is installed, as the Linux tarball's VERSION.
          [IO.File]::WriteAllText("$PWD\$stage\VERSION", "$version`n")
          Compress-Archive -Path $stage -DestinationPath "target\windows\$name.zip"
          Get-Item "target\windows\$name.zip" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: zuno-windows
          path: target/windows/*.zip
          if-no-files-found: error

  # **One job publishes, after every build has finished**, so a release is either complete or
  # absent — never Linux-only because the Mac build was still running or had failed. Runs on a
  # `workflow_dispatch` too, publishing nothing, so the checksums and notes are exercised before
  # a tag depends on them.
  publish:
    needs: [deb, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `scripts/install.sh` reads this file for two things, not one: the hash, and the
      # asset's *real* filename. cargo-deb appends a Debian revision the git tag does not
      # carry (`zuno_0.2.5-1_amd64.deb` for tag v0.2.5), so an installer that builds the
      # name from the tag 404s on every download. Publishing the list means the name is
      # read rather than guessed.
      - name: Write the checksums
        working-directory: dist
        run: |
          ls -lh
          # A bare glob, not `./*.deb`: the latter records the name as `./zuno_…deb`, which is
          # a worse artifact to read and was the spelling that broke the installer's lookup on
          # the first release to carry this file. The installer tolerates both now; this keeps
          # the published list plain.
          sha256sum -- *.deb *.tar.gz *.AppImage *.zip > sha256sums.txt
          cat sha256sums.txt

      # Written to a file rather than piped: `--notes-file` and `--generate-notes` are
      # mutually exclusive in gh, and a heredoc nested inside a YAML block scalar depends
      # on the indentation surviving two levels of stripping.
      - name: Write the release notes
        run: |
          {
            echo '### Install or update'
            echo
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/aryanjha256/zuno/main/scripts/install.sh | sh'
            echo '```'
            echo
            echo 'The same command does both — it installs Zuno if you do not have it and'
            echo 'updates it if you do. On Debian and Ubuntu it installs the .deb and asks'
            echo 'for sudo only to run `apt-get install`; everywhere else — Fedora, openSUSE,'
            echo 'Arch — it unpacks the tarball into `~/.local`, with no sudo at all.'
            echo
            echo 'On a Mac with Apple Silicon it installs `Zuno.app` into `/Applications`. Use'
            echo 'the command rather than downloading the macOS archive in a browser: the app'
            echo 'is not notarized yet, and macOS blocks a notarization-less app a browser'
            echo 'downloaded, while one installed this way opens normally.'
            echo
            echo 'On Windows, in PowerShell:'
            echo
            echo '```powershell'
            echo 'irm https://raw.githubusercontent.com/aryanjha256/zuno/main/scripts/install.ps1 | iex'
            echo '```'
            echo
            echo 'It installs for your user only, with no admin rights, and adds Zuno to the'
            echo 'Start menu, the desktop, your PATH and Settings > Apps, where Uninstall removes'
            echo 'all of it. Running it again updates Zuno.'
            echo
            echo '<details><summary>Or install the .deb by hand</summary>'
            echo
            echo '```bash'
            echo 'sudo apt install ./zuno_*_amd64.deb'
            echo '```'
            echo
            echo 'Use `apt install ./file.deb` rather than `dpkg -i`, so the runtime'
            echo 'dependencies are resolved for you.'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Or unpack the tarball by hand</summary>'
            echo
            echo '```bash'
            echo 'tar -xzf zuno-*-x86_64-linux.tar.gz --strip-components=1 -C ~/.local'
            echo '```'
            echo
            echo 'It needs `libxkbcommon`, `libxkbcommon-x11` and `libxcb`, which every'
            echo 'desktop already has, plus a Vulkan driver.'
            echo
            echo '</details>'
            echo
            echo '<details><summary>Or run the AppImage — one file, nothing installed</summary>'
            echo
            echo '```bash'
            echo 'chmod +x Zuno-*-x86_64.AppImage && ./Zuno-*-x86_64.AppImage'
            echo '```'
            echo
            echo 'It needs FUSE, which desktop systems have; where it is missing, run it with'
            echo '`--appimage-extract-and-run`. It uses the same system libraries as the tarball.'
            echo
            echo '</details>'
            echo
            echo 'Requires x86-64 Linux with glibc 2.35+: Ubuntu 22.04+, Debian 12+,'
            echo 'Fedora 36+, or anything as recent — or an Apple Silicon Mac on macOS 11+,'
            echo 'or 64-bit Windows 10 or 11.'
            echo
            echo 'Zuno renders through Vulkan. On a machine with no GPU driver present,'
            echo 'install `mesa-vulkan-drivers` as well.'
          } > release-notes.md
          cat release-notes.md

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zuno $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  # The installer is the only shipped artifact with no compiler behind it, and its failure
  # mode is that it breaks *only for people who do not have Zuno yet* — precisely the
  # population that cannot report it. So the published release is installed for real, in a
  # clean container, before anyone else tries it.
  #
  # `needs: publish` and a tag guard, because it installs the release that job just published.
  smoke:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Its own `timeout-minutes`: a job-level one cannot say which phase stalled, and the
      # twin of this step in `installer.yml` died reporting only "The operation was canceled".
      - name: Install the published release in a clean Ubuntu 22.04
        timeout-minutes: 10
        env:
          # 22.04 is the floor the .deb claims (`libc6 (>= 2.35)`), so this also proves the
          # claim rather than trusting it.
          IMAGE: ubuntu:22.04
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm \
            -e "ZUNO_VERSION=$version" \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD/scripts/install.sh:/install.sh:ro" \
            "$IMAGE" sh -c '
              set -eux

              # A container does not inherit the apt mirror of the runner that started it: a
              # stock ubuntu:22.04 ships archive.ubuntu.com, which is geo-routed and throttled
              # from Azure, while the hosted image uses azure.archive.ubuntu.com in the same
              # datacentre. This step passed in five minutes on the run that gave the twin job
              # a fifteen-minute timeout, which is the spread this removes.
              sed -i -e "s|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g" -e "s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g" /etc/apt/sources.list

              # Not silenced. As `-qq >/dev/null` these printed nothing at all while they
              # stalled, so the log ended at the image pull and said nothing about the phase.
              apt-get update
              apt-get install -y curl ca-certificates

              sh /install.sh

              # Installed, and installed where the .desktop and the launcher expect. The
              # filename must equal the app_id or Wayland shows a generic icon with no
              # error anywhere, so it is asserted rather than assumed.
              # No `-f` format: `${Package}` inside double quotes is expanded by *this* shell,
              # and under `set -eu` an unset parameter aborts the job.
              dpkg-query -W zuno
              test -x /usr/bin/zuno
              test -f /usr/share/applications/dev.zuno.Zuno.desktop
              test -f /usr/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg

              # The update path: re-running is what an existing user does, and it has to be
              # a clean no-op rather than a reinstall or an error.
              out=$(sh /install.sh 2>&1)
              printf "%s\n" "$out"
              case "$out" in
                *"already the latest"*) echo "ok: re-run is a no-op" ;;
                *) echo "::error::re-running the installer did not report an up-to-date install"; exit 1 ;;
              esac
            '

  # **The published tarball, on Fedora, as an ordinary user** — the `smoke` job's check for the
  # path every non-apt Linux takes. `installer.yml`'s `tarball` job proves the script's logic
  # against a stand-in binary; this is the one that proves the *real* archive installs and that
  # its binary finds every library it links.
  smoke-tarball:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the published tarball in a clean Fedora
        timeout-minutes: 10
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm \
            -e "ZUNO_VERSION=$version" \
            -v "$PWD/scripts/install.sh:/install.sh:ro" \
            fedora:latest sh -c '
              set -eux
              # util-linux for `su`, which the minimal image leaves out — see `installer.yml`.
              dnf install -y tar util-linux
              command -v curl || dnf install -y curl
              # **The three desktop libraries the binary links**, which every Fedora desktop
              # already has and a minimal container does not — read off the release binary with
              # `readelf -d`: libxcb, libxkbcommon and libxkbcommon-x11, beside glibc and
              # libgcc. The tarball declares no dependencies, so this list is what the `ldd`
              # check below holds it to. A new NEEDED entry fails the job rather than a
              # user, which is the point: README says what a tarball install needs.
              dnf install -y libxcb libxkbcommon libxkbcommon-x11
              useradd -m tester

              su tester -c "ZUNO_VERSION=$ZUNO_VERSION sh /install.sh"

              bin=/home/tester/.local/bin/zuno
              test -x "$bin"
              test -f /home/tester/.local/share/applications/dev.zuno.Zuno.desktop
              test -f /home/tester/.local/share/icons/hicolor/scalable/apps/dev.zuno.Zuno.svg
              grep -qx "Exec=\"$bin\"" /home/tester/.local/share/applications/dev.zuno.Zuno.desktop

              ldd "$bin"
              if ldd "$bin" | grep -q "not found"; then
                echo "::error::the tarball binary links a library a Fedora desktop may lack"
                exit 1
              fi

              out=$(su tester -c "ZUNO_VERSION=$ZUNO_VERSION sh /install.sh" 2>&1)
              printf "%s\n" "$out"
              case "$out" in
                *"already the latest"*) echo "ok: re-run is a no-op" ;;
                *) echo "::error::re-running the installer did not report an up-to-date install"; exit 1 ;;
              esac
            '

  # **The published AppImage, opened up on Fedora.** Downloaded and checked against the release's
  # own `sha256sums.txt`, then extracted rather than run — a container has no FUSE and no display
  # — so what is proven is the part packaging can break: the AppDir layout the runtime and desktop
  # tools read, and a binary that finds every library it links on a distro it was not built on.
  smoke-appimage:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Extract and check the published AppImage in a clean Fedora
        timeout-minutes: 10
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm \
            -e "ZUNO_VERSION=$version" \
            -e "REPO=$GITHUB_REPOSITORY" \
            fedora:latest sh -c '
              set -eux
              command -v curl || dnf install -y curl
              # The same three desktop libraries as `smoke-tarball`, for the same reason.
              dnf install -y libxcb libxkbcommon libxkbcommon-x11

              cd /tmp
              base="https://github.com/$REPO/releases/download/v$ZUNO_VERSION"
              file="Zuno-$ZUNO_VERSION-x86_64.AppImage"
              curl -fsSL -o sha256sums.txt "$base/sha256sums.txt"
              curl -fsSL -o "$file" "$base/$file"
              grep " $file\$" sha256sums.txt | sha256sum -c -

              chmod +x "$file"
              "./$file" --appimage-extract >/dev/null
              test -e squashfs-root/AppRun
              test -f squashfs-root/dev.zuno.Zuno.desktop
              test -f squashfs-root/dev.zuno.Zuno.svg
              test -x squashfs-root/usr/bin/zuno

              ldd squashfs-root/usr/bin/zuno
              if ldd squashfs-root/usr/bin/zuno | grep -q "not found"; then
                echo "::error::the AppImage binary links a library a Fedora desktop may lack"
                exit 1
              fi
            '


  # **The published app, installed on a real Mac through the default path** — `/Applications`,
  # no `ZUNO_APP_DIR` — which `installer.yml`'s fake-release job never takes. The runner's
  # account is an admin, so this is the no-sudo branch every first account on a Mac takes.
  smoke-macos:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the published release
        timeout-minutes: 10
        run: |
          set -eux
          export ZUNO_VERSION="${GITHUB_REF_NAME#v}"
          sh scripts/install.sh

          app=/Applications/Zuno.app
          codesign --verify --strict --verbose=2 "$app"
          test -f "$app/Contents/Resources/zuno.icns"
          installed=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$installed" = "$ZUNO_VERSION"
          # No quarantine flag: the whole premise of installing through curl.
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then
            echo "::error::the installed app is quarantined, so Gatekeeper will block it"
            exit 1
          fi

          out=$(sh scripts/install.sh 2>&1)
          printf "%s\n" "$out"
          case "$out" in
            *"already the latest"*) echo "ok: re-run is a no-op" ;;
            *) echo "::error::re-running the installer did not report an up-to-date install"; exit 1 ;;
          esac

  # **The published zip, installed through `install.ps1` under Windows PowerShell 5.1** — the
  # shell a fresh Windows opens — then uninstalled the way Settings > Apps does it.
  smoke-windows:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install the published release
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ZUNO_VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          $env:ZUNO_ASSUME_YES = '1'
          Invoke-Expression (Get-Content -Raw scripts/install.ps1)

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Zuno'
          $exe = Join-Path $dir 'zuno.exe'
          if (-not (Test-Path $exe)) { throw 'no zuno.exe' }
          if ((Get-Content (Join-Path $dir 'VERSION')).Trim() -ne $env:ZUNO_VERSION) { throw 'wrong VERSION' }
          # No Mark of the Web, which is the whole premise of installing through PowerShell.
          if (Get-Item -LiteralPath $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
            throw 'zuno.exe carries the Mark of the Web, so SmartScreen will stop it'
          }

          $out = Invoke-Expression (Get-Content -Raw scripts/install.ps1) *>&1 | Out-String
          if ($out -notmatch 'already the latest') { throw "re-running was not a no-op: $out" }

          $uninstall = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Zuno').UninstallString
          $process = Start-Process -FilePath cmd.exe -ArgumentList "/d /c $uninstall" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0 -or (Test-Path $dir)) { throw 'the uninstaller did not remove Zuno' }
