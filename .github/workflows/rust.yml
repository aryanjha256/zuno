name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # Zuno builds warning-free; make CI enforce that rather than relying on someone
  # noticing. Safe to apply globally: Cargo builds registry dependencies with
  # `--cap-lints allow`, so this only fails on the workspace's own crates.
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
