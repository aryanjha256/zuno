[package]
name = "zuno-core"
version.workspace = true
edition.workspace = true

# NOTE: gpui must never appear here. See architecture.md §1, rule 1 — the core
# has to compile and unit-test without a window. The workspace split is what
# makes that rule mechanical instead of aspirational.
[dependencies]
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
http.workspace = true
reqwest.workspace = true
reqwest_cookie_store.workspace = true
cookie_store.workspace = true
tokio.workspace = true
url.workspace = true
async-channel.workspace = true
futures-util.workspace = true
# Promoted from a dev-dependency when collections landed: the on-disk collection format
# lives here rather than in `app` precisely so a future CLI can read and write it, and
# that means the core has to serialize, not just model.
serde_json.workspace = true
# Trashing a request is a collection-file operation, so it lives beside `remove` rather than
# in the app — a future CLI deleting a request wants the same choice a person does.
trash.workspace = true
# Timing a connection needs a tower `Layer` around reqwest's connector; reqwest does not
# re-export the traits. See `engine/probe.rs`.
tower-layer.workspace = true
tower-service.workspace = true
# WebSocket. See the workspace manifest for why these three and why `connect` is off.
hyper.workspace = true
hyper-util.workspace = true
tokio-tungstenite.workspace = true
# The inline body diff. See the workspace manifest for why this crate and not another.
similar.workspace = true
# HTML -> readable text for the response viewer. See the workspace manifest for the choice.
html2text.workspace = true
# gRPC. See the workspace manifest for why these and why not `tonic`.
http-body-util.workspace = true
protox.workspace = true
prost-reflect.workspace = true
prost.workspace = true

[dev-dependencies]
# **A spike, and the reason it is a dev-dependency.** gRPC reports its status in HTTP/2
# *trailers*, which reqwest names nowhere in its public API — the plan is to reach them through
# `From<Response> for http::Response<Body>` and `http_body::Body::poll_frame`. Three layers
# agreeing is not something to take on trust (see `tests/websocket_upgrade.rs` for the last time
# this mattered), so a real h2 server proves it before any schema work is built on top.
#
# `server` + `http2` on hyper, and `http-body-util` for a body that can actually emit a trailers
# frame. None of this reaches the shipped binary: dev-dependency features do not apply to
# `cargo build`.
hyper = { workspace = true, features = ["server", "http2"] }
