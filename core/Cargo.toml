[package]
name = "zuno-core"
version.workspace = true
edition.workspace = true

# NOTE: gpui must never appear here. See architecture.md §1, rule 1 — the core
# has to compile and unit-test without a window. The workspace split is what
# makes that rule mechanical instead of aspirational.
[dependencies]
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
http.workspace = true
reqwest.workspace = true
tokio.workspace = true
url.workspace = true
async-channel.workspace = true
futures-util.workspace = true
# Promoted from a dev-dependency when collections landed: the on-disk collection format
# lives here rather than in `app` precisely so a future CLI can read and write it, and
# that means the core has to serialize, not just model.
serde_json.workspace = true
# Trashing a request is a collection-file operation, so it lives beside `remove` rather than
# in the app — a future CLI deleting a request wants the same choice a person does.
trash.workspace = true
